[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuri"
version = "0.1.0"
description = "Vendor-agnostic neuroscience meta-harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Unlicense" }
authors = [
    { name = "Neuri Team" }
]
keywords = ["neuroscience", "agent", "meta-harness", "bids", "mri", "eeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20240314",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20240314",
]

[project.scripts]
neuri = "neuri.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/neuri"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (Python 3.12+)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["neuri"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "textual.*",
    "tomli_w.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --strict-markers"
