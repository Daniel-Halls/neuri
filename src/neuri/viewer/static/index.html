<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuri NiiVue WebGL2 Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #111827;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      z-index: 10;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
    }
    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      font-size: 0.8rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .segmented-group {
      display: flex;
      background: #1e293b;
      padding: 2px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    button {
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      color: #ffffff;
      background: #334155;
    }
    button.active {
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .layer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .layer-controls select {
      background: #0b0f17;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
    }
    .layer-controls input[type="range"] {
      width: 70px;
      accent-color: #38bdf8;
    }
    .status-panel {
      font-size: 0.78rem;
      color: #cbd5e1;
      display: flex;
      gap: 14px;
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .coord-pill {
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(11, 15, 23, 0.82);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 0.75rem;
      line-height: 1.45;
      pointer-events: none;
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    #controls-hint {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(11, 15, 23, 0.75);
      backdrop-filter: blur(4px);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 0.7rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@niivue/niivue@0.44.0/dist/niivue.umd.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>◈ NEURI</h1>
      <span id="scene-title">Waiting for scene manifest...</span>
    </div>
    <div class="controls">
      <div class="segmented-group">
        <button id="btn-multi" class="active" onclick="setViewMode(0)">Multi</button>
        <button id="btn-axial" onclick="setViewMode(1)">Axial</button>
        <button id="btn-coronal" onclick="setViewMode(2)">Coronal</button>
        <button id="btn-sagittal" onclick="setViewMode(3)">Sagittal</button>
        <button id="btn-3d" onclick="setViewMode(4)">3D</button>
      </div>
      <div class="layer-controls">
        <label for="colormap-select">Colormap:</label>
        <select id="colormap-select" onchange="onColormapChange(this.value)">
          <option value="gray">Gray</option>
          <option value="warm">Warm</option>
          <option value="cool">Cool</option>
          <option value="jet">Jet</option>
          <option value="plasma">Plasma</option>
          <option value="viridis">Viridis</option>
          <option value="magma">Magma</option>
        </select>
        <label for="opacity-slider">Opacity:</label>
        <input type="range" id="opacity-slider" min="0" max="100" value="100" oninput="onOpacityChange(this.value)">
      </div>
    </div>
    <div class="status-panel">
      <span id="coords-mni" class="coord-pill">MNI: (0.0, 0.0, 0.0)</span>
      <span id="intensity-val" class="coord-pill">Val: --</span>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="gl"></canvas>
    <div id="hud">
      <div><strong>Scene:</strong> <span id="hud-scene-id">None</span></div>
      <div><strong>Volumes:</strong> <span id="hud-layers">0</span></div>
      <div><strong>Crosshair:</strong> Active</div>
    </div>
    <div id="controls-hint">
      Drag: slice │ Right-click: zoom │ Scroll: cycle │ Space: crosshair
    </div>
  </div>

  <script>
    let nv = null;
    let currentSceneId = null;

    async function initNiiVue() {
      if (typeof niivue === "undefined") {
        document.getElementById("scene-title").innerText = "Error: NiiVue WebGL2 library not loaded.";
        return;
      }
      nv = new niivue.Niivue({
        backColor: [0.043, 0.059, 0.090, 1.0], // #0B0F17 Obsidian Neuro canvas
        show3Dcrosshair: true,
        loadingText: "Loading neuroimaging volume...",
        onLocationChange: (data) => {
          if (data && data.mm) {
            document.getElementById("coords-mni").innerText =
              `MNI: (${data.mm[0].toFixed(1)}, ${data.mm[1].toFixed(1)}, ${data.mm[2].toFixed(1)})`;
          }
          if (data && data.values && data.values.length > 0) {
            document.getElementById("intensity-val").innerText =
              `Val: ${data.values[0].value.toFixed(2)}`;
          }
        }
      });
      nv.attachTo("gl");
      pollScene();
      setInterval(pollScene, 2000);
    }

    function setViewMode(mode) {
      if (!nv) return;
      nv.setSliceType(mode);
      const buttons = ["btn-multi", "btn-axial", "btn-coronal", "btn-sagittal", "btn-3d"];
      buttons.forEach((id, idx) => {
        const btn = document.getElementById(id);
        if (btn) {
          if (idx === mode) btn.classList.add("active");
          else btn.classList.remove("active");
        }
      });
    }

    function onColormapChange(colormapName) {
      if (!nv || !nv.volumes || nv.volumes.length === 0) return;
      nv.setColorMap(nv.volumes[0].id, colormapName);
      nv.updateGLVolume();
    }

    function onOpacityChange(val) {
      if (!nv || !nv.volumes || nv.volumes.length === 0) return;
      const opacity = parseFloat(val) / 100.0;
      nv.setOpacity(nv.volumes[0].id, opacity);
      nv.updateGLVolume();
    }

    async function pollScene() {
      try {
        const res = await fetch("/api/scene");
        if (!res.ok) return;
        const scene = await res.json();
        if (!scene || !scene.scene_id) return;
        if (scene.scene_id === currentSceneId) return;

        currentSceneId = scene.scene_id;
        document.getElementById("scene-title").innerText = scene.title || "Active Neuroimaging Scene";
        document.getElementById("hud-scene-id").innerText = scene.scene_id;
        document.getElementById("hud-layers").innerText = (scene.volumes ? scene.volumes.length : 0);

        if (scene.volumes && scene.volumes.length > 0) {
          const volumeList = scene.volumes.map(v => ({
            url: v.artifact_uri.startsWith("http") ? v.artifact_uri : `/api/file?uri=${encodeURIComponent(v.artifact_uri)}`,
            colormap: v.colormap || "gray",
            opacity: v.opacity !== undefined ? v.opacity : 1.0,
            cal_min: v.cal_min,
            cal_max: v.cal_max
          }));
          await nv.loadVolumes(volumeList);
          if (scene.volumes[0].colormap) {
            const sel = document.getElementById("colormap-select");
            if (sel) sel.value = scene.volumes[0].colormap;
          }
        }

        if (scene.slice_type) {
          const modeMap = {
            "multiplanar": 0,
            "axial": 1,
            "coronal": 2,
            "sagittal": 3,
            "render3d": 4
          };
          const m = modeMap[scene.slice_type];
          if (m !== undefined) setViewMode(m);
        }

        if (scene.crosshair_mni) {
          nv.setCrosshairLocation(scene.crosshair_mni);
        }
      } catch (err) {
        console.warn("Scene poll failed:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", initNiiVue);
  </script>
</body>
</html>
