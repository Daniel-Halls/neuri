<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuri Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #111827;
      --border: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }
    .splash-logo {
      font-size: 3.5rem;
      animation: pulse 1.8s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.4));
    }
    .splash-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
    }
    .splash-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-logo">🧠</div>
    <div>
      <h1 class="splash-title">NEURI STUDIO</h1>
      <p class="splash-subtitle">Initializing neural compute &amp; local workspaces...</p>
    </div>
    <div class="spinner"></div>
  </div>
</body>
</html>
