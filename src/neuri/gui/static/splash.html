<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuri Studio</title>
  <link rel="icon" type="image/png" href="assets/neuri_icon.png">
  <style>
    :root {
      --bg: #0c1115;
      --panel: #10161b;
      --surface: #141b21;
      --border: #212b34;
      --primary: #e6e8eb;
      --text: #e6e8eb;
      --muted: #6e7b88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      padding: 36px 48px;
      background: rgba(16, 22, 27, 0.72);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .splash-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.2s infinite ease-in-out;
    }

    .splash-logo img {
      width: 240px;
      height: auto;
      display: block;
    }

    .splash-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--muted);
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    }

    .splash-subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-top: 6px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-top: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.86;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="splash-card">
    <div class="splash-logo">
      <img src="assets/neuri_logo.png" alt="NEURI">
    </div>
    <div>
      <h1 class="splash-title">NEURI STUDIO</h1>
      <p class="splash-subtitle">Initializing compute &amp; local workspaces...</p>
    </div>
    <div class="spinner"></div>
  </div>
</body>

</html>
